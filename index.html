<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="Play Tic-Tac-Toe against a computer with adjustable difficulty.">
  <title>Tic-Tac-Toe</title>
  <style>
    :root{color-scheme:dark;--bg:#101522;--panel:#192235;--cell:#222f46;--line:#34445f;--text:#f3f6fc;--muted:#aab6ca;--accent:#8b9cff;--win:#56d6a1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#263656 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}
    main{width:min(100%,460px)}
    header{text-align:center;margin-bottom:22px}
    h1{font-size:clamp(2rem,7vw,2.7rem);letter-spacing:-.05em;margin:0 0 5px}
    header p,.hint{color:var(--muted);margin:0}
    .panel{background:rgba(25,34,53,.96);border:1px solid var(--line);border-radius:24px;padding:clamp(16px,4vw,22px);box-shadow:0 22px 70px #0005}
    .status{text-align:center;font-weight:650;font-size:1.08rem;min-height:32px;margin:0 0 14px}
    .settings{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 16px;color:var(--muted)}
    select{background:#111a2a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
    .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
    .score{background:#111a2a;border:1px solid var(--line);border-radius:13px;padding:10px 5px;text-align:center}
    .score strong{display:block;font-size:1.4rem}
    .score span{font-size:.78rem;color:var(--muted)}
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;aspect-ratio:1}
    .cell{min-width:0;min-height:0;border:1px solid var(--line);border-radius:16px;background:var(--cell);font-size:clamp(2.7rem,14vw,4.2rem);font-weight:750;display:grid;place-items:center;color:var(--text);cursor:pointer;touch-action:manipulation;transition:background .15s,transform .15s}
    .cell:disabled{cursor:default;opacity:1}
    .cell:not(:disabled):hover{background:#2c3b57;transform:translateY(-2px)}
    .cell.x{color:#aab7ff}.cell.o{color:#69ddb0}
    .cell.winner{background:#214638;border-color:var(--win)}
    .actions{display:flex;gap:10px;margin-top:18px}
    .actions button{flex:1;border:0;border-radius:12px;padding:13px 12px;font:inherit;font-weight:650;cursor:pointer}
    .primary{background:var(--accent);color:#11182a}.secondary{background:#29364d;color:var(--text)}
    button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:3px}
    .hint{text-align:center;font-size:.82rem;margin-top:15px}
    @media(max-width:360px){.board{gap:7px}.cell{border-radius:12px}.score span{font-size:.7rem}}
  </style>
</head>
<body>
  <main>
    <header><h1>Tic-Tac-Toe</h1><p>You’re X. The computer is O.</p></header>
    <section class="panel" aria-label="Tic-Tac-Toe game">
      <p class="status" id="status" aria-live="polite">Your turn — make a move.</p>
      <div class="settings">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="scores" aria-label="Scoreboard">
        <div class="score"><strong id="wins">0</strong><span>Your wins</span></div>
        <div class="score"><strong id="draws">0</strong><span>Draws</span></div>
        <div class="score"><strong id="losses">0</strong><span>Computer wins</span></div>
      </div>
      <div class="board" id="board" role="group" aria-label="Game board"></div>
      <div class="actions">
        <button class="primary" id="new" type="button">New game</button>
        <button class="secondary" id="reset" type="button">Reset score</button>
      </div>
      <p class="hint" id="hint">Medium: the computer thinks ahead, but can make mistakes.</p>
    </section>
  </main>
  <script>
    'use strict';
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const difficultyEl = document.getElementById('difficulty');
    const hintEl = document.getElementById('hint');
    const winsEl = document.getElementById('wins');
    const drawsEl = document.getElementById('draws');
    const lossesEl = document.getElementById('losses');

    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board = Array(9).fill('');
    let finished = false;
    let busy = false;
    let scores = {X:0,D:0,O:0};
    let winning = [];

    function outcome(state) {
      for (const line of lines) {
        const [a,b,c] = line;
        if (state[a] && state[a] === state[b] && state[a] === state[c]) return {winner:state[a],line};
      }
      return state.every(Boolean) ? {winner:'D',line:[]} : null;
    }

    function render() {
      boardEl.replaceChildren();
      board.forEach((mark,index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'cell' + (mark ? ' ' + mark.toLowerCase() : '') + (winning.includes(index) ? ' winner' : '');
        button.textContent = mark;
        button.disabled = Boolean(mark) || finished || busy;
        button.setAttribute('aria-label','Square ' + (index + 1) + (mark ? ', ' + mark : ', empty'));
        button.addEventListener('click',() => humanMove(index));
        boardEl.append(button);
      });
    }

    function updateScores() {
      winsEl.textContent = scores.X;
      drawsEl.textContent = scores.D;
      lossesEl.textContent = scores.O;
    }

    function finish(result) {
      finished = true;
      winning = result.line;
      if (result.winner === 'X') { scores.X++; statusEl.textContent = 'You win! Nice move.'; }
      else if (result.winner === 'O') { scores.O++; statusEl.textContent = 'Computer wins. Try again!'; }
      else { scores.D++; statusEl.textContent = 'It’s a draw!'; }
      updateScores();
      render();
    }

    function heuristic(state) {
      let score = 0;
      for (const line of lines) {
        const values = line.map(index => state[index]);
        const os = values.filter(value => value === 'O').length;
        const xs = values.filter(value => value === 'X').length;
        if (os && xs) continue;
        if (os) score += os === 2 ? 8 : os === 1 ? 2 : 0;
        if (xs) score -= xs === 2 ? 9 : xs === 1 ? 2 : 0;
      }
      return score;
    }

    function minimax(state,player,depth,maxDepth) {
      const result = outcome(state);
      if (result) return {score:result.winner === 'O' ? 100-depth : result.winner === 'X' ? depth-100 : 0,index:-1};
      if (depth >= maxDepth) return {score:heuristic(state),index:-1};
      let best = {score:player === 'O' ? -Infinity : Infinity,index:-1};
      for (let index=0; index<9; index++) {
        if (state[index]) continue;
        state[index] = player;
        const score = minimax(state,player === 'O' ? 'X' : 'O',depth+1,maxDepth).score;
        state[index] = '';
        if ((player === 'O' && score > best.score) || (player === 'X' && score < best.score)) best = {score,index};
      }
      return best;
    }

    function computerMove() {
      const available = board.map((mark,index) => mark ? null : index).filter(index => index !== null);
      if (!available.length) return -1;
      const level = difficultyEl.value;
      if (level === 'easy') return available[Math.floor(Math.random()*available.length)];
      return minimax(board,'O',0,level === 'hard' ? Infinity : 2).index;
    }

    function humanMove(index) {
      if (finished || busy || board[index]) return;
      board[index] = 'X';
      const result = outcome(board);
      if (result) { finish(result); return; }
      busy = true;
      statusEl.textContent = 'Computer is thinking…';
      render();
      window.setTimeout(() => {
        const move = computerMove();
        if (move >= 0) board[move] = 'O';
        busy = false;
        const nextResult = outcome(board);
        if (nextResult) finish(nextResult);
        else { statusEl.textContent = 'Your turn — make a move.'; render(); }
      },250);
    }

    function newGame() {
      board = Array(9).fill('');
      finished = false;
      busy = false;
      winning = [];
      statusEl.textContent = 'Your turn — make a move.';
      render();
    }

    function updateHint() {
      const messages = {
        easy:'Easy: the computer chooses a random available square.',
        medium:'Medium: the computer thinks ahead, but can make mistakes.',
        hard:'Hard: the computer uses perfect play. You can force a draw, but cannot beat it.'
      };
      hintEl.textContent = messages[difficultyEl.value];
    }

    difficultyEl.addEventListener('change',() => { updateHint(); newGame(); });
    document.getElementById('new').addEventListener('click',newGame);
    document.getElementById('reset').addEventListener('click',() => { scores = {X:0,D:0,O:0}; updateScores(); newGame(); });
    updateHint();
    newGame();
  </script>
</body>
</html>
